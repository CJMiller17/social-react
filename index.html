<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animation Test</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "Indie Flower", cursive;
      }
      .background {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: url("src/assets/waves.png") repeat center;
        background-size: cover;
        animation: animateBackground 30s linear infinite;
      }
      @keyframes animateBackground {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 100% 0;
        }
      }
      .content {
        position: relative;
        height: 100%;
        overflow-y: scroll;
        padding: 2rem;
        box-sizing: border-box;
      }
      .post {
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(255, 255, 255, .8);
        border-radius: 5px;
      }
      h1 {
        font-size: 3.5rem;
        color: white;
        font-family: "Indie Flower", cursive;
        font-weight: 400;
        font-style: normal;
      }
      hr {
        margin-bottom: 1em;
      }
      input::placeholder {
        font-family: "Indie Flower", cursive;
        font-weight: 900;
        font-style: normal;
        font-size: larger;
      }
      html {
        background-color: #79bbc8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="background"></div>
      <div class="content">
        <h1>Hello, World!</h1>
        <hr>
        <div class="post">
          <p>This is a test post.</p>
        </div>
      </div>
    </div>
  </body>
</html>
