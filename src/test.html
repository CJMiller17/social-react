<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Animation Test</title>
  </head>
  <body>
    <svg width="800" height="600">
      <filter id="turbulence">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="turbulence"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="20"/>
        <animate href="#turbulence" attributeName="baseFrequency" dur="5s" keyTimes="0;1" values="0.03;0.06" repeatCount="indefinite"/>
      </filter>
      <rect width="800" height="600" fill="blue" fill-opacity="0.5" style="filter: url(#turbulence);" />
    </svg>

    
    <script>
      // Output the animate and target elements to the console
      const animateElement = document.querySelector('animate');
      const targetElement = document.querySelector('#turbulence');
      console.log('Animate Element:', animateElement);
      console.log('Target Element:', targetElement);
    </script>
  </body>
</html>
